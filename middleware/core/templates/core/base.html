<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <meta name="description" content="">
        <meta name="author" content="">
        <title>Little Fashion</title>
        <!-- CSS FILES -->
        {% load static %}
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100;300;400;700;900&display=swap" rel="stylesheet">
        <link href="{% static 'core/css/bootstrap.min.css' %}" rel="stylesheet">
        <link href="{% static 'core/css/bootstrap-icons.css' %}" rel="stylesheet">
        <link rel="stylesheet" href="{% static 'core/css/slick.css' %}"/> 
        <link href="{% static 'core/css/tooplate-little-fashion.css' %}" rel="stylesheet">
    </head>
    
    <body>

        <section class="preloader">
            <div class="spinner"> 
                <span class="sk-inner-circle"></span>
            </div>
        </section>
    

        <main>
          <nav class="navbar navbar-expand-lg">
              <div class="container">
                  <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                      <span class="navbar-toggler-icon"></span>
                  </button>

                  <a class="navbar-brand" href="/">
                      <img loading="lazy" class="img img-fluid" alt="Archivo binario" src="https://www.netdata.com.mx/web/image/product.template/11754/image_128?unique=1759522574000" name="image_1920" style="width: 12%;">
                  </a>

                  <div class="d-lg-none">

                      <a href="product-detail.html" class="bi-bag custom-icon"></a>
                  </div>

                  <div class="collapse navbar-collapse" id="navbarNav">                        
                        {% if not request.user.is_authenticated %}
                          <div class="d-none d-lg-block" style="display: flex !important; flex-basis: auto; align-items: center; justify-content: space-evenly; width: 12%; align-content: center; flex-direction: row-reverse; flex-wrap: nowrap; margin-left: auto;">
                                <a href="{% url 'login' %}" class="bi-person custom-icon me-3"></a>
                          </div>
                        {% else %}
                          <ul class="navbar-nav mx-auto">
                            <li class="nav-item">
                                <a class="nav-link {% if request.path == '/' %} active {% endif %}" href="{% url 'core:home' %}">Home</a>
                            </li>

                            <li class="nav-item">
                                <a class="nav-link {% if request.path == '/original-message/' %} active {% endif %}" href="{% url 'original_message:original_message_list' %}">Original Message</a>
                            </li>

                            <li class="nav-item">
                                <a class="nav-link {% if request.path == '/unit-message/' %} active {% endif %}" href="{% url 'unit_message:unit_message_list' %}">Unit Message</a>
                            </li>
                          </ul>
                          <div>
                            <a href="{% url 'log-out' %}" class="nav-link">{{ user.username }}</a>
                          </div>
                        {% endif %}
                  </div>
              </div>
          </nav>
          
          {% block content %} {% endblock %}
        </main>

        <footer class="site-footer">
            <div class="container">
                <div class="row">

                    <div class="col-lg-3 col-10 me-auto mb-4">
                        <h4 class="text-white mb-3"><a href="{% url 'core:home' %}">NetData</a> Solutions</h4>
                        <p class="copyright-text text-muted mt-lg-5 mb-4 mb-lg-0">Copyright © 2025 <strong>NetData Solutions</strong></p>
                    </div>

                    <div class="col-lg-3 col-4">
                        <h5 class="text-white mb-3">Social</h5>

                        <ul class="social-icon">
                            <li><a href="#" class="social-icon-link bi-whatsapp"></a></li>

                            <li><a href="#" class="social-icon-link bi-instagram"></a></li>
                        </ul>
                    </div>

                </div>
            </div>
        </footer>

        <!-- JAVASCRIPT FILES -->
        <script src="{% static 'core/js/jquery.min.js' %}"></script>
        <script src="{% static 'core/js/bootstrap.bundle.min.js' %}"></script>
        <script src="{% static 'core/js/Headroom.js' %}"></script>
        <script src="{% static 'core/js/jQuery.headroom.js' %}"></script>
        <script src="{% static 'core/js/slick.min.js' %}"></script>
        <script src="{% static 'core/js/custom.js' %}"></script>

 
  <!-- Bootstrap JavaScript Libraries -->
  <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.9.2/dist/umd/popper.min.js"
    integrity="sha384-IQsoLXl5PILFhosVNubq5LC7Qb9DXgDA9i+tQ8Zj3iwWAwPtgFTxbJ8NT4GN1R8p"
    crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.min.js"
    integrity="sha384-cVKIPhGWiC2Al4u+LWgxfKTRIcfu0JTxR+EQDz/bgldoEyl4H0zUF0QKbrJ0EcQF"
    crossorigin="anonymous"></script>
  <script>
    // Get the current year for the copyright
    $("#year").text(new Date().getFullYear());

    //Verificar si el carrito se encuentra en el localStorage
    if (localStorage.getItem('cart') == null){
      localStorage.clear();
      var cart = {};
    } else {
      var cart = JSON.parse( localStorage.getItem('cart') );
      showBadgeCart();
    }

    function showBadgeCart(){
      var totalItems = 0;
      for (var id in cart){
        totalItems += parseInt(cart[id]);
      }

      $('#cart-badge').text(totalItems.toString());
    }

    function addCart(idProduct){
      qtyById = $("#inputQty_"+idProduct).val()

      if( cart[idProduct] != undefined ){
        cart[idProduct] = parseInt(cart[idProduct]) + parseInt(qtyById);
      } else {
        if (qtyById === '') {
          cart[idProduct] = 1;
        } else {
          cart[idProduct] = parseInt(qtyById);
        }
      }

      localStorage.setItem('cart', JSON.stringify(cart));
      showBadgeCart();
    }

    function showOrder() {
      if (localStorage.getItem('cart') != null){
        $('#order_data').val(localStorage.getItem('cart'));
        $('#cartForm').submit();
      }
    }
  </script>
</body>

</html>
