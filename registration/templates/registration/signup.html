{% block content %}
{% load static %}


<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <meta name="description" content="">
        <meta name="author" content="">
        <title>Middleware</title>
        <!-- CSS FILES -->
        {% load static %}
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100;300;400;700;900&display=swap" rel="stylesheet">
        <link href="{% static 'core/css/bootstrap.min.css' %}" rel="stylesheet">
        <link href="{% static 'core/css/bootstrap-icons.css' %}" rel="stylesheet">
        <link rel="stylesheet" href="{% static 'core/css/slick.css' %}"/> 
        <link href="{% static 'core/css/tooplate-little-fashion.css' %}" rel="stylesheet">
    </head>
    
    <body>

        <section class="preloader">
            <div class="spinner">
                <span class="sk-inner-circle"></span>
            </div>
        </section>
    
        <main>


        <section class="sign-in-form section-padding">
            <div class="container">
                <div class="row">

                    <div class="col-lg-8 mx-auto col-12">

                        <h1 class="hero-title text-center mb-5">Sign Up</h1>


                        <div class="row">
                            <div class="col-lg-8 col-11 mx-auto">
                                <form action="" method='post'>
                                    {% csrf_token %}
                                    {{form.as_p}}
                                    <p>
                                        <input id='btn_submit' type="submit" class="btn custom-btn form-control mt-4 mb-3" value='Create account'/>
                                    </p>
                                </form>
                            </div>
                        </div>
                        
                    </div>

                </div>
            </div>
        </section>


        </main>

        <footer class="site-footer">
            <div class="container">
                <div class="row">

                    <div class="col-lg-3 col-10 me-auto mb-4">
                        <h4 class="text-white mb-3"><a href="{% url 'core:home' %}">Little</a> Fashion</h4>
                        <p class="copyright-text text-muted mt-lg-5 mb-4 mb-lg-0">Copyright © 2022 <strong>Middleware</strong></p>
                        <br>
                        <p class="copyright-text">Designed by <a href="https://www.tooplate.com/" target="_blank">Tooplate</a></p>
                    </div>

                    <div class="col-lg-3 col-4">
                        <h5 class="text-white mb-3">Social</h5>

                        <ul class="social-icon">

                            <li><a href="#" class="social-icon-link bi-youtube"></a></li>

                            <li><a href="#" class="social-icon-link bi-whatsapp"></a></li>

                            <li><a href="#" class="social-icon-link bi-instagram"></a></li>

                            <li><a href="#" class="social-icon-link bi-skype"></a></li>
                        </ul>
                    </div>

                </div>
            </div>
        </footer>

        <!-- JAVASCRIPT FILES -->
        <script src="{% static 'core/js/jquery.min.js' %}"></script>
        <script src="{% static 'core/js/bootstrap.bundle.min.js' %}"></script>
        <script src="{% static 'core/js/Headroom.js' %}"></script>
        <script src="{% static 'core/js/jQuery.headroom.js' %}"></script>
        <script src="{% static 'core/js/slick.min.js' %}"></script>
        <script src="{% static 'core/js/custom.js' %}"></script>

    </body>
</html>

{% endblock %}
